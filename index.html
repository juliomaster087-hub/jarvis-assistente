<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Jarvis Assistente — seu assistente digital.">
  <title>Jarvis Assistente</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--accent:#62d6c5;--muted:#a8b5c9}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 50% 15%,#1b3550 0,#0b1220 55%);color:#f4f7fb;display:grid;place-items:center;padding:24px}
    main{width:min(720px,100%);text-align:center;background:#121d30dd;border:1px solid #ffffff18;border-radius:28px;padding:clamp(28px,6vw,56px);box-shadow:0 24px 80px #0006}
    .orb{width:104px;height:104px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;font-size:42px;color:#07151b;background:radial-gradient(circle at 35% 30%,#b5fff1,#42b9ad 65%,#14716e);box-shadow:0 0 55px #43d8c755}
    .eyebrow{color:var(--accent);letter-spacing:.18em;text-transform:uppercase;font-size:.78rem;font-weight:700}
    h1{font-size:clamp(2.3rem,7vw,4.2rem);line-height:1.05;margin:12px 0}
    p{color:var(--muted);font-size:1.08rem;line-height:1.7;max-width:540px;margin:0 auto}
    button{margin-top:28px;border:0;border-radius:999px;padding:14px 24px;background:var(--accent);color:#08201f;font-weight:800;font-size:1rem;cursor:pointer}
    button:hover{filter:brightness(1.08);transform:translateY(-1px)}#response{min-height:1.6em;margin-top:18px;color:var(--accent);font-weight:600}
    footer{margin-top:34px;color:#7f91aa;font-size:.85rem}
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true">✦</div>
    <div class="eyebrow">Assistente digital</div>
    <h1>Olá, eu sou o Jarvis.</h1>
    <p>Seu espaço para ideias, organização e produtividade. Um assistente simples, pronto para evoluir com você.</p>
    <button id="hello" type="button">Conhecer o Jarvis</button>
    <div id="response" role="status" aria-live="polite"></div>
    <footer>Jarvis Assistente · Projeto em construção</footer>
  </main>
  <script>
    document.getElementById('hello').addEventListener('click', () => {
      document.getElementById('response').textContent = 'Estou pronto para ajudar. O que vamos criar hoje?';
    });
  </script>
</body>
</html>
